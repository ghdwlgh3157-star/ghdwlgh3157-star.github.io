<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno AI Track Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glow-effect {
            box-shadow: 0 0 35px -5px rgba(168, 85, 247, 0.4);
        }
        .gradient-bg {
            background: radial-gradient(circle at top left, #2e1065, #0f172a, #020617);
        }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

    <header class="w-full max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-music text-lg text-white"></i>
            </div>
            <span class="font-extrabold text-xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">
                SUNO MUSIC
            </span>
        </div>
        <a href="https://suno.com/s/gVYE2iJMcK1NCCL5" target="_blank" rel="noopener noreferrer" 
           class="glass-effect hover:bg-white/20 transition-all text-sm font-semibold px-4 py-2 rounded-full flex items-center gap-2">
            <span>Suno에서 열기</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
        </a>
    </header>

    <main class="w-full max-w-4xl mx-auto px-4 py-8 flex flex-col items-center">
        <div class="w-full glass-effect rounded-3xl p-6 sm:p-10 glow-effect flex flex-col items-center space-y-8">
            
            <!-- Badge & Title Section -->
            <div class="text-center space-y-3">
                <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-purple-500/20 text-purple-300 border border-purple-500/30">
                    <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span>
                    AI Generated Track
                </span>
                <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white">
                    Featured Song Showcase
                </h1>
                <p class="text-gray-400 text-sm sm:text-base max-w-lg mx-auto">
                    Suno AI로 생성된 특별한 트랙을 감상해보세요. 아래 임베드 플레이어에서 바로 재생 가능합니다.
                </p>
            </div>

            <div class="w-full max-w-2xl bg-black/40 rounded-2xl p-2 sm:p-4 border border-white/10 shadow-2xl overflow-hidden">
                <div class="relative w-full aspect-video sm:aspect-[16/9] rounded-xl overflow-hidden">
                    <iframe 
                        src="https://suno.com/embed/s/gVYE2iJMcK1NCCL5" 
                        class="w-full h-full border-0 rounded-xl"
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                        loading="lazy"
                        title="Suno Track Player">
                    </iframe>
                </div>
            </div>

            <div class="flex flex-wrap justify-center items-center gap-4 w-full max-w-md pt-2">
                <button onclick="copyTrackUrl()" class="flex-1 min-w-[140px] bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 px-6 rounded-2xl shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copy-text">링크 복사하기</span>
                </button>
                <a href="https://suno.com/s/gVYE2iJMcK1NCCL5" target="_blank" rel="noopener noreferrer" 
                   class="flex-1 min-w-[140px] glass-effect hover:bg-white/15 text-white font-semibold py-3 px-6 rounded-2xl text-center transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-external-link"></i>
                    <span>원본 페이지</span>
                </a>
            </div>

            <!-- Notification Toast -->
            <div id="toast" class="hidden fixed bottom-8 bg-purple-600 text-white px-6 py-3 rounded-full font-medium shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 flex items-center gap-2">
                <i class="fa-solid fa-circle-check"></i>
                <span>링크가 클립보드에 복사되었습니다!</span>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-6 text-gray-500 text-sm">
        <p>© 2026 Powered by Suno AI & Web Embed</p>
    </footer>

    <script>
        function copyTrackUrl() {
            const trackUrl = "https://suno.com/s/gVYE2iJMcK1NCCL5";
            
            // Temporary input creation for reliable iframe execution
            const dummy = document.createElement("input");
            document.body.appendChild(dummy);
            dummy.value = trackUrl;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            // Toast animation
            const toast = document.getElementById("toast");
            toast.classList.remove("hidden");
            setTimeout(() => {
                toast.classList.remove("translate-y-4", "opacity-0");
                toast.classList.add("translate-y-0", "opacity-100");
            }, 10);

            setTimeout(() => {
                toast.classList.remove("translate-y-0", "opacity-100");
                toast.classList.add("translate-y-4", "opacity-0");
                setTimeout(() => {
                    toast.classList.add("hidden");
                }, 300);
            }, 2500);
        }
    </script>
</body>
</html>
